EJSS_INTERFACE.RENOLABS.labControl=function(mName){
  var self=EJSS_INTERFACE.panel(mName);
  var mLab = {};
  var buttonWidth = '0px';
  var buttonHeight = '0px';

  var b1 = EJSS_INTERFACE.twoStateButton(mName+'_btnPlay');
  var b2 = EJSS_INTERFACE.twoStateButton(mName+'_btnPause');
  var b3 = EJSS_INTERFACE.twoStateButton(mName+'_btnReset');
  var b4 = EJSS_INTERFACE.twoStateButton(mName+'_btnUpdate');
  var b5 = EJSS_INTERFACE.twoStateButton(mName+'_btnPower');
  var b6 = EJSS_INTERFACE.twoStateButton(mName+'_btnVersion');

  b1.setImageUrlOn(EJSS_INTERFACE.RENOLABS.Images.Play);
  b1.setImageUrlOff(EJSS_INTERFACE.RENOLABS.Images.Play);
  b2.setImageUrlOn(EJSS_INTERFACE.RENOLABS.Images.Pause);
  b2.setImageUrlOff(EJSS_INTERFACE.RENOLABS.Images.Pause);
  b3.setImageUrlOn(EJSS_INTERFACE.RENOLABS.Images.Reset);
  b3.setImageUrlOff(EJSS_INTERFACE.RENOLABS.Images.Reset);
  b4.setImageUrlOn(EJSS_INTERFACE.RENOLABS.Images.Update);
  b4.setImageUrlOff(EJSS_INTERFACE.RENOLABS.Images.Update);
  b5.setImageUrlOn(EJSS_INTERFACE.RENOLABS.Images.PowerOn);
  b5.setImageUrlOff(EJSS_INTERFACE.RENOLABS.Images.PowerOff);
  //b6.setImageUrlOn(EJSS_INTERFACE.RENOLABS.Images.Main);
  //b6.setImageUrlOff(EJSS_INTERFACE.RENOLABS.Images.Private);

  self.appendChild(b1);
  self.appendChild(b2);
  self.appendChild(b3);
  self.appendChild(b4);
  self.appendChild(b5);
  //self.appendChild(b6);

  self.setLab=function(lab){
    mLab = lab;
    if (!mLab.socket || mLab.socket.disconnected) {
      b1.setDisabled(true);
      b2.setDisabled(true);
      b3.setDisabled(true);
      b4.setDisabled(true);
      b5.setDisabled(true);
      //b6.setDisabled(true);
      return;
    }
    else {
      b4.setDisabled(false);
      b5.setDisabled(false);
      //b6.setDisabled(false);
    }
    
    /* Fixed Relations */
    var button_state = null;
    switch (mLab.state_REAL.config) {
      case 0:
        button_state = [0, 0, 0, 0, 1];
        break;
      case 1:
        button_state = [1, 1, 0, 0, 0];
        break;
      case 2:
        button_state = [1, 0, 1, 1, 0];
        break;
      case 3:
        button_state = [1, 1, 0, 1, 0];
        break;
      default:
        break;
    }
    if (button_state) {
      b1.setDisabled(!button_state[1]);
      b2.setDisabled(!button_state[2]);
      b3.setDisabled(!button_state[3]);
      //b6.setDisabled(!button_state[4]);
      b5.setState(!button_state[0]);
    }
  };
  self.getLab=function(){
    return mLab;
  };
  self.setButtonWidth=function(width){
    if(typeof width!=="string")width=width+"px";
    if(buttonWidth==width)return;
    buttonWidth=width;
    b1.getStyle().setWidth(buttonWidth);
    b2.getStyle().setWidth(buttonWidth);
    b3.getStyle().setWidth(buttonWidth);
    b4.getStyle().setWidth(buttonWidth);
    b5.getStyle().setWidth(buttonWidth)
    //b6.getStyle().setWidth(buttonWidth)
  };
  self.getButtonWidth=function(){
    return buttonWidth
  };
  self.setButtonHeight=function(height){
    if(typeof height!=="string")height=height+"px";
    if(buttonHeight==height)return;
    buttonHeight=height;
    b1.getStyle().setHeight(buttonHeight);
    b2.getStyle().setHeight(buttonHeight);
    b3.getStyle().setHeight(buttonHeight);
    b4.getStyle().setHeight(buttonHeight);
    b5.getStyle().setHeight(buttonHeight)
    //b6.getStyle().setHeight(buttonHeight)
  };
  self.getButtonHeight=function(){
    return buttonHeight
  };
  self.registerProperties=function(controller){
    EJSS_CORE.promoteToControlElement(b1,self.getView(),b1.getName());
    EJSS_CORE.promoteToControlElement(b2,self.getView(),b2.getName());
    EJSS_CORE.promoteToControlElement(b3,self.getView(),b3.getName());
    EJSS_CORE.promoteToControlElement(b4,self.getView(),b4.getName());
    EJSS_CORE.promoteToControlElement(b5,self.getView(),b5.getName());
    //EJSS_CORE.promoteToControlElement(b6,self.getView(),b6.getName());
    EJSS_INTERFACE.RENOLABS.LabControl.registerProperties(self,controller);

    b1.setAction('OnClick', function(_data,_info) { if (mLab.send_connect) mLab.send_connect(2) });
    b1.setAction('OffClick', function(_data,_info) { if (mLab.send_connect) mLab.send_connect(2) });
    b2.setAction('OnClick', function(_data,_info) { if (mLab.send_connect) mLab.send_connect(3) });
    b2.setAction('OffClick', function(_data,_info) { if (mLab.send_connect) mLab.send_connect(3) });
    b3.setAction('OnClick', function(_data,_info) {
      if (mLab.send_connect) mLab.send_connect(4);
      setTimeout(function() {
        if (mLab.reset) mLab.reset()
      }, 1000)
    });
    b3.setAction('OffClick', function(_data,_info) {
      if (mLab.send_connect) mLab.send_connect(4);
      if (mLab.reset) mLab.reset()
    });
    b4.setAction('OnClick', function(_data,_info) { if (mLab.update) mLab.update() });
    b4.setAction('OffClick', function(_data,_info) { if (mLab.update) mLab.update() });
    b5.setAction('OnClick', function(_data,_info) { if (mLab.send_connect) mLab.send_connect(1, 0); if (mLab.reset) mLab.reset() });
    b5.setAction('OffClick', function(_data,_info) { if (mLab.send_connect) mLab.send_connect(0) });
  };
  self.setButtonWidth('120px');
  self.setButtonHeight('50px');
  return self
};

EJSS_INTERFACE.RENOLABS.labLogin=function(mName){
  var self = EJSS_INTERFACE.panel(mName+'_parameter');
  var mLabs = null;
  var columnWidth = '0px';
  var rowHeight = '0px';

  var user_label = EJSS_INTERFACE.imageAndTextButton(mName+'_user_label');
  var user_value = EJSS_INTERFACE.textField(mName+'_user_value');
  var pass_label = EJSS_INTERFACE.imageAndTextButton(mName+'_pass_label');
  var pass_value = EJSS_INTERFACE.passwordField(mName+'_pass_value');
  var login_button = EJSS_INTERFACE.twoStateButton(mName+'login_button');

  user_label.setText('User');
  user_label.setDisabled(true);
  user_label.getStyle().setColor('black');
  user_label.getStyle().setTextAlign('left');

  user_value.setEditable(false);
  user_value.getStyle().setColor('blue');

  pass_label.setText('Password');
  pass_label.setDisabled(true);
  pass_label.getStyle().setColor('black');
  pass_label.getStyle().setTextAlign('left');

  pass_value.setEditable(false);
  pass_value.getStyle().setColor('blue');

  login_button.setImageUrlOn(EJSS_INTERFACE.RENOLABS.Images.PowerOn);
  login_button.setImageUrlOff(EJSS_INTERFACE.RENOLABS.Images.PowerOff);
  login_button.setState(1);

  self.appendChild(user_label);
  self.appendChild(user_value);
  self.appendChild(pass_label);
  self.appendChild(pass_value);
  self.appendChild(login_button);

  self.setLabs=function(labs){
    var hasKey = false;
    var isConnected = false;
    if (labs.constructor === Array) {
      mLabs = labs;
    }
    else {
      mLabs = [labs];
    }
    for (var i = 0; i < mLabs.length; i++) {
      if (mLabs[i].key_ejs)
        hasKey = true;
      if (mLabs[i].socket && mLabs[i].socket.connected) {
        isConnected = true;
      }
    }
    if (hasKey)
      self.getStyle().setDisplay('none');
    else
      self.getStyle().setDisplay('');
    if (!isConnected) {
      user_value.setEditable(true);
      pass_value.setEditable(true);
      pass_value.setDisabled(false);
      login_button.setState(1);
    }
    else {
      user_value.setEditable(false);
      pass_value.setEditable(false);
      pass_value.setDisabled(true);
      login_button.setState(0);
    }
  };
  self.getLabs=function(){

  self.setControlFont=function(font){
    user_label.getStyle().setFont(font);
    user_value.getStyle().setFont(font);
    pass_label.getStyle().setFont(font);
    pass_value.getStyle().setFont(font);
    login_button.getStyle().setFont(font);
  };
  self.registerProperties=function(controller){
    EJSS_CORE.promoteToControlElement(login_button,self.getView(),login_button.getName());
    EJSS_INTERFACE.RENOLABS.LabLogin.registerProperties(self,controller);

    login_button.setAction('OnClick',
      function(_data,_info) {
        for (var i = 0; i < mLabs.length; i++) {
          if (mLabs[i]) {
            mLabs[i].user = user_value.getValue();
            mLabs[i].password = pass_value.getValue();
          }
          if (mLabs[i].connect) mLabs[i].connect()
        }
      });

    login_button.setAction('OffClick',
      function(_data,_info) {
        for (var i = 0; i < mLabs.length; i++) {
          if (mLabs[i].disconnect) mLabs[i].disconnect();
        }
      });
  };

  return self;
};

EJSS_INTERFACE.RENOLABS.labFunctionParameter=function(mName){
  var self=EJSS_INTERFACE.panel(mName);

  var mLab = null;
  var mConfig = undefined;
  var parameters = [];
  var indexes = [];
  var max_parameters = 0;
  var configured = false;
  var storedConfigNo = undefined;
  var storedConfigParameter = undefined;

  var controlWidth = '0px';
  var controlHeight = '0px';
  var columnWidth = '0px';
  var rowHeight = '0px';
  var font = undefined;

  var parTitle = EJSS_INTERFACE.RENOLABS.labParameterHeader(mName+'_titles');

  var parFunction = EJSS_INTERFACE.RENOLABS.labOptionsParameter(mName+'_function');
  parFunction.setTitle('Tipo');
  parFunction.setDisabled(true);

  self.appendChild(parTitle);
  self.appendChild(parFunction);

  function displayFunctionPanel() {
    if (mLab && mLab.config && mConfig) {
      var index = parFunction.getEjsValue();
      indexes = mLab.config[mConfig].options[index].parameter_indexes;

      for (var i = 0; i < indexes.length; i++) {
        parameters[i].getStyle().setVisibility(true);
        parameters[i].setTitle(mLab.config[mConfig].parameter_names[indexes[i]]);
      }
      for (var i = indexes.length; i < max_parameters; i++) {
        parameters[i].getStyle().setVisibility(false);
        parameters[i].setTitle('---');
      }
    }
  }

  function reportChange() {
    var controller = self.getController();
    if (controller) {
      controller.immediatePropertyChanged('Lab')
    }
  };

  function getArrayOfZeros(size) {
    var result = [];
    for (var i = 0; i < size; i++)
      result.push(0);
    return result;
  }

  function setEjsState() {
    for (var i = 0; i < indexes.length; i++) {
      mLab.state_EJS.inputs[mConfig][indexes[i] + 1] = parameters[i].getEjsValue();
    }
    reportChange();
  }

  function configureView() {
    if (!mLab || !mLab.socket || mLab.socket.disconnected || !mLab.config || !mConfig) return;
    if (mLab.configNo !== storedConfigNo || mConfig !== storedConfigParameter) {
      /* Apply remote lab configuration */
      max_parameters = 0;
      var options = [];
      for (var i = 0; i < mLab.config[mConfig].options.length; i++) {
        options.push(mLab.config[mConfig].options[i].name);
        var parNumber = mLab.config[mConfig].options[i].parameter_indexes.length;
        if (max_parameters < parNumber) max_parameters = parNumber;
      }
      parFunction.setOptions(options);

      if (!mLab.state_EJS.inputs[mConfig])
        mLab.state_EJS.inputs[mConfig] = getArrayOfZeros(mLab.config[mConfig].parameter_names.length + 1);
      if (!mLab.state_REAL.inputs[mConfig])
        mLab.state_REAL.inputs[mConfig] = getArrayOfZeros(mLab.config[mConfig].parameter_names.length + 1);

      /* Create the maximum number of parameters that can be displayed */
      for (var i = 0; i < max_parameters; i++) {
        if (i < parameters.length) {
          parameters[i].getStyle().setDisplay('block');
          parameters[i].getStyle().setVisibility(false);
          continue;
        }

        var control = EJSS_INTERFACE.RENOLABS.labNumberParameter(mName+'_par_'+i, '---');
        parameters.push(control);

        /* Inherit sizes and fonts */
        control.setColumnWidth(columnWidth);
        control.setRowHeight(rowHeight);
        if (font) control.setControlFont(font);

        /* Initially not visible */
        control.getStyle().setDisplay('block');
        control.getStyle().setVisibility(false);

        EJSS_CORE.promoteToControlElement(control,self.getView(),control.getName());
        control.setAction("OnChange", setEjsState);
        self.appendChild(control);
      }

      for (var i = max_parameters; i < parameters.length; i++) {
        parameters[i].getStyle().setDisplay('none');
        parameters[i].getStyle().setVisibility(false);
      }

      storedConfigNo = mLab.configNo;
      storedConfigParameter = mConfig;
      configured = true;
    }
  }

  self.setLab=function(lab){
    mLab = lab;

    /* Criteria for reseting the panel */
    if (!mLab || !mLab.socket || mLab.socket.disconnected || !mLab.config || !mConfig) {
      if (configured) {
        parFunction.reset();
        parFunction.setDisabled(true);
        for (var i = 0; i < parameters.length; i++){
          parameters[i].getStyle().setDisplay('none');
          parameters[i].getStyle().setVisibility(false);
          parameters[i].setTitle('---');
          parameters[i].setEditable(false);
        }
        mLab.state_EJS.inputs = {};
        mLab.state_REAL.inputs = {};
        configured = false;
      }
      return;
    }

    if (mLab.configNo !== storedConfigNo || mConfig !== storedConfigParameter)
      configured = false;

    if (!configured)
      configureView();

    if (!configured) {
      mLab.state_EJS.inputs[mConfig][0] = 0;
      parFunction.setEjsValue(mLab.state_EJS.inputs[mConfig][0]);
      return;
    }

    parFunction.setDisabled(false);
    for (var i = 0; i < parameters.length; i++)
      parameters[i].setEditable(true);
    
    /* Fixed Relations */
    parFunction.setEjsValue(mLab.state_EJS.inputs[mConfig][0]);
    displayFunctionPanel();

    if(mLab.state_EJS.inputs[mConfig] !== undefined) {
      for (var i = 0; i < indexes.length; i++) {
        parameters[i].setEjsValue(mLab.state_EJS.inputs[mConfig][indexes[i] + 1]);
      }
    }    
    if(mLab.state_REAL.inputs[mConfig] !== undefined) {
      parFunction.setRealValue(mLab.state_REAL.inputs[mConfig][0]);
      for (var i = 0; i < indexes.length; i++) {
        parameters[i].setRealValue(mLab.state_REAL.inputs[mConfig][indexes[i] + 1]);
        parameters[i].updateEjsBackgroundColor();
      }
    }
  };
  self.getLab=function(){
    return mLab;
  };
  self.setConfig=function(config){
    if (config !== mConfig) {
      mConfig = config;
    }
  };
  self.getConfig=function(){
    return mConfig;
  };
  self.setWidth=function(width){
    if(typeof width!=="string")width=width+"px";
    if(controlWidth==width)return;
    controlWidth=width;
    self.getStyle().setWidth(controlWidth);
  };
  self.setHeight=function(height){
    if(typeof height!=="string")height=height+"px";
    if(controlHeight==height)return;
    controlHeight=height;
    self.getStyle().setHeight(controlHeight);
  };
  self.setColumnWidth=function(width){
    if(typeof width!=="string")width=width+"px";
    if(columnWidth==width)return;
    columnWidth=width;

    parTitle.setColumnWidth(columnWidth);

    parFunction.setColumnWidth(columnWidth);
    for (var i = 0; i < indexes.length; i++) {
      parameters[i].setColumnWidth(columnWidth);
    }
  };
  self.getColumnWidth=function(){
    return columnWidth
  };
  self.setRowHeight=function(height){
    if(typeof height!=="string")height=height+"px";
    if(rowHeight==height)return;
    rowHeight=height;

    parTitle.setRowHeight(rowHeight);

    parFunction.setRowHeight(rowHeight);
    for (var i = 0; i < indexes.length; i++) {
      parameters[i].setRowHeight(rowHeight);
    }
  };
  self.getRowHeight=function(){
    return rowHeight
  };
  self.setControlFont=function(_font){
    font = _font;
    parTitle.setControlFont(font);

    parFunction.setControlFont(font);
    for (var i = 0; i < indexes.length; i++) {
      parameters[i].setControlFont(font);
    }
  };
  self.registerProperties=function(controller){
    EJSS_CORE.promoteToControlElement(parFunction,self.getView(),parFunction.getName());
    EJSS_INTERFACE.RENOLABS.LabFunctionParameter.registerProperties(self,controller);

    parFunction.linkProperty("EjsValue",
      function() { if (mLab && mConfig && mLab.state_EJS.inputs[mConfig]) return mLab.state_EJS.inputs[mConfig][0]; return 0; },
      function(_v) {
        if (mLab && mConfig && mLab.state_EJS.inputs[mConfig]) {
          mLab.state_EJS.inputs[mConfig][0] = _v;

          displayFunctionPanel();
        }
      }
    );
  };
  self.getStyle().setBorderStyle('double');
  self.getStyle().setBorderWidth(5);
  self.getStyle().setBorderColor('DarkGrey');
  self.setColumnWidth('120px');
  self.setRowHeight('50px');
  return self
};

<script type="text/javascript"><!--//--><![CDATA[//><!--
class LabInstance {
  state_EJS = { inputs: {}, outputs: {} };
  state_REAL = { config: 0, evolution: [], inputs: {}, outputs: {} }; //[0: disconnected, 1: ready, 2: play, 3: pause, 4: reset] 

  constructor(address, port, handlers) {
    this.address = address; 
    this.port = port;
    this.key_ejs = undefined;
    this.user = undefined;
    this.password = undefined;
    this.configNo = 0;
    this.config = undefined;
    this.socket = undefined;
    this.BUFFER_SIZE = 1000;
    this.buffer = [];
    this.handlers = handlers;
  };

  /**
   * Create an io socket and try to open a new connection with the configured remote laboratory server.
   */
  connect() {
    this.key_ejs = this._getLabKey();
    if (!this.key_ejs && !this.user) return;
    this._createSocket();
    if(this.socket.disconnected) {
      this.socket.query = this.socket.io.opts.query = this._getQueryString();
      this.socket.connect();
    }
  }
  
  _getLabKey() {
    let key;
    try {
      key = parent.LAB_KEY || LAB_KEY;
    } catch(e) {
      key = this.key_ejs;
    }
    return key;
  } 
  
  _createSocket() {
    if (this.socket) { return }
    this.socket = io.connect(this._getURL(), { query: this._getQueryString() });
    this.socket.on('connect', this.onconnect.bind(this));
    this.socket.on('signals.info', this.onconfig.bind(this));
    this.socket.on('signals.get', this.onsignals.bind(this));
    this.socket.on('disconnect_timeout', this.ondisconnecttimeout.bind(this));
    this.socket.on('disconnect', this.disconnect.bind(this));
  }

  _getURL() {
    let url;
    try {
      url = parent.LAB_ADDRESS || LAB_ADDRESS;
    } catch(e) {
      url = 'http://' + this.address + ':' + this.port;
    };
    return url;
  }

  _getQueryString() {
    if (this.key_ejs) {
      return `key=${this.key_ejs}&activity=${this.getActivity()}`;
    }
    const user = this.user || ''; 
    const password = this.password || '';
    return `user=${user}&password=${password}&activity=${this.getActivity()}`;
  }
  
  getActivity() {
    try {
      return parent.LAB_ACTIVITY || LAB_ACTIVITY;
    } catch(e) {
      return this.activity;
    };
  }

  setActivity(name) {
    this.activity = name;   
  }
  
  /**
  * Handle the connection event. 
  */ 
  onconnect() {
    this.socket.emit('signals.info', {
      request: 'config'
    });
  }    

  /**
  * Receive the configuration metadata. 
  */ 
  onconfig(data) {
    if (data.request == 'config') {
      this.config = data.response;
      this.configNo++;
    }
    try {
      var endtime = new Date(data.session.timeout);
      // var message = 'Estás conectado al Laboratorio.\n La hora de finalización de la sesión es: ' + endtime.toLocaleTimeString();
      // alert(message);
      this.handlers['onconfig'](data);
    } catch(e) {}
  }

  /**
  * Receive signals data. 
  */ 
  onsignals(data) {
    if(!Array.isArray(data)) { data = [data]; }
    for (var i = 0; i < data.length; i++) {
      var state = data[i];
      if(state['variable'] == 'evolution') {
        this.buffer.push(state['value']);
      } else {
        this.state_REAL[state.variable] = state.value;
        this.state_REAL.inputs[state.variable] = state.value;
      }
    }
    try {
      this.handlers['onsignals'](data);
    } catch {}
  }    

  /**
  * Receive signals data. 
  */
 update() {
    try {
      var batch = [];
      for (var key in this.state_EJS) {
        if (this.state_REAL[key] != this.state_EJS[key]) {
          batch.push({variable: key, value: this.state_EJS[key]});
        }
      }
      for (var key in this.state_EJS.inputs) {
        if (this.state_REAL.inputs[key] != this.state_EJS.inputs[key]) {
          batch.push({variable: key, value: this.state_EJS.inputs[key]});
        }
      }
      this.socket.emit('signals.set', batch);
    } catch(e) {
      console.error('cannot send variables to server.');
    }
  }

  send(events) {
    this.socket.emit('signals.set', events);
  }

  /**
  * Disconnect from the lab.
  */ 
  disconnect() {
    this.config = undefined;
    if (this.key_ejs) { window.location = "./select"; }
    alert('Te has desconectado del laboratorio. La sesión finalizará si no hay mas clientes conectados.');
    if (this.socket.connected) {
      this.socket.disconnect();
    }
    try {
      this.handlers['ondisconnect'](data);
    } catch {}
  }

  ondisconnecttimeout(data) {
    alert('Aviso: La sesión ha finalizado.');
    window.location = "./home";
  }

  /**
  * Send a config command. 
  */ 
 send_connect(variable, controller) {
      let data = { variable: 'config', value: [variable] };
      if (variable == 1) { data['version'] = controller; }
      this.socket.emit('signals.set', data);
  }

  /**
  * Set user credentials. 
  */ 
 setCredentials(credentials) {
      if (!credentials) { return; }
      if (credentials['user'] !== undefined) { this.user = credentials['user']; }
      if (credentials['password'] !== undefined) { this.password = credentials['password'] }
  }
};

  function posicion (t1,t2,t3,t4) {  // > CustomCode.Cinematica Directa:1
    x = Math.cos(t1)*(l3*Math.cos(t3)-l2*Math.cos(t2+ang90)) + Math.cos(t1)*(41+18);  // > CustomCode.Cinematica Directa:2
    y = Math.sin(t1)*(l3*Math.cos(t3)-l2*Math.cos(t2+ang90))+ Math.sin(t1)*(41+18);  // > CustomCode.Cinematica Directa:3
    z = -l3*Math.sin(t3)+l2*Math.sin(t2+ang90);  // > CustomCode.Cinematica Directa:4
    R = t4 + t1;  // > CustomCode.Cinematica Directa:5
    xyzr = [x, y, z, R];  // > CustomCode.Cinematica Directa:6
    return xyzr;  // > CustomCode.Cinematica Directa:7
  }      // > CustomCode.Cinematica Directa:8

  function inversa (px,py,pz,p) {  // > CustomCode.Cinematica Inversa:1
      // > CustomCode.Cinematica Inversa:2
      /* Para el ángulo de la base hay más de una solución posible. Si se usa solo una de ellas, el brazo da un "salto" en px = 0. Nos aseguramos de que la solución total para el ángulo  // > CustomCode.Cinematica Inversa:3
      t1 sea continua de esta forma: */  // > CustomCode.Cinematica Inversa:4
         // > CustomCode.Cinematica Inversa:5
    t1 = Math.atan2(py, px);  // > CustomCode.Cinematica Inversa:7
      // > CustomCode.Cinematica Inversa:16
    c1 = Math.cos(t1);  // > CustomCode.Cinematica Inversa:17
    s1 = Math.sin(t1);  // > CustomCode.Cinematica Inversa:18
    t234 = p+ang90;  // > CustomCode.Cinematica Inversa:19
    s234 = Math.sin(t234);  // > CustomCode.Cinematica Inversa:20
    c234 = Math.cos(t234);  // > CustomCode.Cinematica Inversa:21
    c3 = (Math.pow(c1*px + s1*py - s234*d5, 2) + Math.pow(pz - d1 + c234*d5, 2) - Math.pow(a2, 2) - Math.pow(a3, 2)) / (2*a2*a3);  // > CustomCode.Cinematica Inversa:22
    s3 = Math.sqrt(Math.max(0, 1 - Math.pow(c3, 2)));  // > CustomCode.Cinematica Inversa:23
    t3 = Math.atan2(s3, c3);  // > CustomCode.Cinematica Inversa:24
    c2 = ((c1*px+s1*py-s234*d5-a1)*(a3*c3+a2)+(pz+c234*d5-d1)*s3*a3)/(Math.pow(a3*c3+a2,2)+Math.pow(s3,2)*Math.pow(a3,2));  // > CustomCode.Cinematica Inversa:25
    s2 = ((c1*px+s1*py-s234*d5-a1)*(a3*s3)-(pz+c234*d5-d1)*(a3*c3+a2))/(Math.pow(a3*c3+a2,2)+Math.pow(s3,2)*Math.pow(a3,2));  // > CustomCode.Cinematica Inversa:26
    t2 = -Math.atan2(s2, c2);  // > CustomCode.Cinematica Inversa:27
    t4 = t234 - t3 - t2;  // > CustomCode.Cinematica Inversa:28
    t1234 = [t1,t2,t3,t4];  // > CustomCode.Cinematica Inversa:29
     // > CustomCode.Cinematica Inversa:30
    return t1234;    // > CustomCode.Cinematica Inversa:31
  }  // > CustomCode.Cinematica Inversa:32

  /* Comandos de control de I/O  // > CustomCode.Comandos del Lenguaje ACL:1
  El comando 'Set/Get IOMultiplexing' puede establecer u obtener cómo se configura una interfaz (No Config, PWM Output, IO Output, IO Input, IO ADC)  // > CustomCode.Comandos del Lenguaje ACL:2
  El comando 'Set/Get IODO' establece u obtiene el valor de la salida (1-20) a 0 o 1.  // > CustomCode.Comandos del Lenguaje ACL:3
  */  // > CustomCode.Comandos del Lenguaje ACL:4
  if (typeof Controller === 'undefined') var Controller = class {};
  class DobotController extends Controller {  // > CustomCode.Comandos del Lenguaje ACL:5
    GET = [ 'DIN', 'DOUT', 'SPEED' ];  // > CustomCode.Comandos del Lenguaje ACL:6
    ACTIONS = {  // > CustomCode.Comandos del Lenguaje ACL:7
        'HOME': 1,               // No args
        'POSITION': 2,           // No args
        'SPEED': 3,              // No args
        'SPEED_JOG': 4,          // [v, a]
        'SPEED_PTP': 5,          // [v, a]
        'MOVE_ANGLE': 6,         // [angle, joint]
        'MOVE_POINT_ANGLE': 7,   // [j1, j2, j3, j4, mode (1->linear, 2->jog)]
        'MOVE_POINT_XYZ': 8,     // [x, y, z, r, mode (1->linear, 2->jog)]
        'INCREASE_ANGLE': 9,     // [j1, j2, j3, j4]
        'INCREASE_XYZ': 10,      // [c, y, z, r, mode (1->linear, 2->jog)]
        'WAIT': 11,              // [delay]
        'MOVE_JOINT': 12,        // [joint]
        'MOVE_COORDINATE': 13,   // [c]
        'GRIP': 14,              // [enable, open/close]
        'STOP': 15,              // No args
        'ABORT': 16,             // No args
        'GET_EIO': 17,           // [address, value]
        'SET_EIO': 18,           // [address, value]
    };
    constructor() {
      super();
      this.position = [0, 0, 0, 0];
      this.joints = [0, 0, 0, 0];
      this.DIN = [0, 0];
      this.DOUT = [0, 0];
      this.SPEED = 100;
      this.tolerance = 1e-4;
      this.polling = 100;
      this.Z_MIN = -120;
    }
    _send(action, args) {
      console.log(args ? [action].concat(args) : [action])
      lab.send({
        variable: 'action',
        value: args ? [action].concat(args) : [action]
      });
    }
    update(state) {
      const trunc = v => { return Math.round(100*v)/100; };
      this.position = state.slice(1, 5).map(trunc);
      this.joints = state.slice(5, 9).map(trunc);
      this.velocity = state[9];
      conn_status = '<p class="text-success">Recibiendo datos de DOBOT M1.</p>';
    }
    closeTo(point) {
      return this.distanceTo(point) < this.tolerance;
    }
    distanceTo(point) {
      return Math.sqrt(this.position
       .map((c, i) => Math.pow(c - point[i], 2))
       .reduce((a, b) => a + b, 0));
    }
    get(key) {
      if(!this.GET.includes(key)) {
        throw Error(`Undefined identifier: ${key}`);
      }
      return this[key];
    }
    delay(ms) {
      status = `<p class="text-success">Esperando ${ms} ms.</p>`;
      this._send(this.ACTIONS['WAIT'], ms);
    }
    async move(point, mode) {
      if (!this.inWorkingVolume(point) || point[2] < this.Z_MIN) {
         this.print("El punto " + point + " está fuera del espacio de trabajo.");
         status = '<p class="text-warning">El punto está fuera del espacio de trabajo.</p>';
         throw "The target is out of reach";
      }
      status = `<p class="text-success">Moviendo a ${point}.</p>`;
      this._send(this.ACTIONS['MOVE_POINT_XYZ'], point.concat((mode != undefined) ? mode : 0));
      this.target = point;
    }
    async moved(point) {
      if (!this.inWorkingVolume(point) || point[2] < this.Z_MIN) {
         status = '<p class="text-warning">El punto está fuera del espacio de trabajo.</p>';
         throw "The target is out of reach";
      }
      status = `<p class="text-success">Moviendo a ${point} .</p>`;
      this._send(this.ACTIONS['MOVE_POINT_XYZ'], point.concat(0));
      while (!this.closeTo(point)) { await this.sleep(this.polling); }
    }
    async speed(value) {
      this.SPEED = value;
      status = `<p class="text-success">Cambiando velocidad a ${value}.</p>`;
      this._send(this.ACTIONS['SPEED_PTP'], [value, value]);
    }
    speed_ptp(speed) {
      this._send(this.ACTIONS['SPEED_PTP'], [speed, speed]);
    }
    speed_jog(speed) {
      this._send(this.ACTIONS['SPEED_JOG'], [speed, (speed < 40) ? 10 : 10]);
    }
    async open() {
      status = `<p class="text-success">Abriendo la pinza.</p>`;
      this._send(this.ACTIONS['GRIP'], [1, 0]);
    }
    async close() {
      status = `<p class="text-success">Cerrando la pinza.</p>`;
      this._send(this.ACTIONS['GRIP'], [1, 1]);
    }
    async home() {
      status = `<p class="text-success">Calibrando inicio.</p>`;
      this._send(this.ACTIONS['HOME']);
    }
    async test() {}
    async stop() {
      status = '<p class="text-danger">El DOBOT M1 se ha detenido con <i>stop</i></p>';
      this._send(this.ACTIONS['STOP']);
    }
    async abort() {
      status = '<p class="text-danger">El DOBOT M1 se ha detenido con <i>abort</i></p>';
      this._send(this.ACTIONS['ABORT']);
    }
    getEffectorPosition() {
      return this.position;
    }
    getJointsPosition() {
      return this.joints;
    }
    setOutput(i, value) {
      this.DOUT[i] = value;
    }
    async getOutput(i) {
      return (i != undefined) ? this.DOUT[i] : this.DOUT;
    }
    print(message) {
      _view.logger.appendText(message);
    }
    inWorkingVolume(point) {
      let distanceToOrigin = Math.sqrt(point.slice(0, 3)
       .map((x, i) => Math.pow(x, 2))
       .reduce((x, y) => x + y, 0));
      return distanceToOrigin < 350 && distanceToOrigin > 140;
    }
    distance(a, b) {
      return a.slice(1, 4)
       .map((x, i) => Math.pow(x - b[i], 2))
       .reduce((x, y) => x + y, 0);
    }
    move_to_point_angle(j1, j2, j3, j4, mode) {
      status = '<p class="text-success">Moviendo.</p>';
      this._send(this.ACTIONS['MOVE_POINT_ANGLE'], [j1, j2, j3, j4, (mode != undefined) ? mode : 0]);
    };
    move_joint(joint) {
      var inside = this.inWorkingVolume(this.position);
      if (!inside || (this.position[2] < this.Z_MIN)) {
        status = '<p class="text-danger">El punto está fuera del espacio de trabajo.</p>';
      }
      status = '<p class="text-success">Moviendo.</p>';
      this._send(this.ACTIONS['MOVE_JOINT'], inside ? [joint]: [0]);
    };
    move_coordinate(axis) {
      var inside = this.inWorkingVolume(this.position);
      if (!inside || (this.position[2] < this.Z_MIN && axis != 2)) {
        status = '<p class="text-danger">El punto está fuera del espacio de trabajo.</p>';
      }
      status = '<p class="text-success">Moviendo.</p>';
      this._send(this.ACTIONS['MOVE_COORDINATE'], inside ? [axis]: [0]);
    };
  }
